[project]
name = "gasolina-mlops"
version = "0.1.0"
description = "Proyecto de prueba CC3105 (UVG): predecir si el precio de la gasolina en Guatemala sube o baja."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]   # permite usar s3://... como storage.base_uri

[project.scripts]
gasolina = "gasolina_mlops.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
